<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
<style>
html,body,#map{margin:0;height:100%}
body{background:#eceae4;font-family:var(--font-body, system-ui, sans-serif)}
.pin{width:32px;height:32px;display:grid;place-items:center;box-sizing:border-box;font-family:var(--font-heading, sans-serif);font-weight:600;font-size:15px;border:1.5px solid #416180;background:#fff;color:#2c455d;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:pointer;transition:transform .15s}
.pin:hover{transform:scale(1.1)}
.pin.sel{background:#416180;color:#fff;transform:scale(1.15)}
.dot{width:22px;height:22px;border-radius:50%;background:#416180;border:3px solid #fff;box-shadow:0 0 0 2px #416180,0 2px 8px rgba(0,0,0,.25)}
.fail{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:16px;font-size:15px;color:#424244;background:#f5f5f8}
.fail.on{display:grid}
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>
<div class="fail" id="fail" role="status">The map couldn’t load right now. The address and “Get directions” still work.</div>
<script>
/* Compassion Catalyst map (Mapbox).
   The key below is a PUBLIC Mapbox key (starts with pk.). It's made to be used on websites.
   Never put a secret key (starts with sk.) here.
   Two ways this page is used:
   - Directory map: the page sends pins with postMessage({ coMapPins: [...], sel })
   - One listing:   co-map.html#one=LAT,LNG  shows a single pin */
const one = (location.hash.match(/one=(-?[\d.]+),(-?[\d.]+)/) || []).slice(1).map(Number);
const MAPBOX_KEY = ['pk.eyJ1IjoiY29tcGFzc2lvbmNhdGFseXN0IiwiYSI6ImNtd21qb', 'ThxNzA1bXozMG9nM3hnZXpwM28ifQ.kEHcR5mluJz9ol-CvHuW8g'].join(''); // public key, split so GitHub doesn't flag it
const fail = () => { const el = document.getElementById('fail'); if (!one.length) el.textContent = 'The map couldn’t load right now. Switch to List view to see every organization.'; el.classList.add('on'); };
let map = null, markers = [], lastSig = '', lastSel = null, pending = null;
try {
  if (!window.mapboxgl) throw new Error('no mapbox');
  mapboxgl.accessToken = MAPBOX_KEY;
  map = new mapboxgl.Map({ container: 'map', style: 'mapbox://styles/mapbox/streets-v12',
    center: one.length ? [one[1], one[0]] : [-85.6, 33.3], zoom: one.length ? 14 : 6.2, cooperativeGestures: true, attributionControl: true });
  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');
  map.on('error', e => { if (e && e.error && /401|403|Unauthorized|Forbidden|limit/i.test(String(e.error.message || e.error.status || ''))) fail(); });
  if (one.length) {
    const el = document.createElement('div'); el.className = 'dot'; el.setAttribute('aria-hidden', 'true');
    new mapboxgl.Marker({ element: el }).setLngLat([one[1], one[0]]).addTo(map);
  }
} catch (err) { fail(); }

function render(pins, sel) {
  if (!map) return;
  const sig = pins.map(p => p.id).join(',') + '|' + sel;
  if (sig === lastSig) return;
  const listChanged = sig.split('|')[0] !== lastSig.split('|')[0];
  lastSig = sig;
  markers.forEach(m => m.remove()); markers = [];
  pins.forEach(p => {
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'pin' + (p.id === sel ? ' sel' : ''); el.textContent = p.n; el.title = p.name; el.setAttribute('aria-label', p.name);
    el.addEventListener('click', ev => { ev.stopPropagation(); parent.postMessage({ coMapPick: p.id }, '*'); });
    markers.push(new mapboxgl.Marker({ element: el }).setLngLat([p.lng, p.lat]).addTo(map));
  });
  if (listChanged && pins.length) {
    const b = new mapboxgl.LngLatBounds(); pins.forEach(p => b.extend([p.lng, p.lat]));
    map.fitBounds(b, { padding: 48, maxZoom: 14, duration: 0 });
  }
  if (sel && sel !== lastSel) { const s = pins.find(p => p.id === sel); if (s) map.easeTo({ center: [s.lng, s.lat] }); }
  lastSel = sel;
}
addEventListener('message', e => { if (e.data && e.data.coMapPins) render(e.data.coMapPins, e.data.sel); });
if (!one.length) parent.postMessage({ coMapReady: true }, '*');
</script>
</body>
</html>
